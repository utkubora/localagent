[project]
name = "localagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic"
]

[project.optional-dependencies]
local = [
    "transformers>=4.45",
    "torch",
    "accelerate",
]

[project.scripts]
localagent = "localagent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

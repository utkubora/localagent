[project]
name = "localagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic"
]

[project.optional-dependencies]
local = [
    "transformers>=4.45",
    "torch",
    "accelerate",
]
rag = [
    "chromadb>=0.5",
]
mcp = [
    "mcp>=2.0",
]

[project.scripts]
localagent = "localagent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Nightly torch pins a linux-only triton build that isn't resolvable when uv
# locks for every platform; this project only runs on Windows anyway.
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
# Stable PyTorch wheels don't cover Python 3.14 yet; the nightly cu128 index
# does and gives CUDA-enabled torch instead of the CPU-only PyPI build.
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true
